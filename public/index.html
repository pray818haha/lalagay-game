﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LALAGAY游戏室</title>
<link rel="stylesheet" href="style.css?v=78">
</head>
<body>

<!-- 大厅 -->
<div id="lobby" class="page">
  <img id="logoTitle" src="%E6%A0%87%E9%A2%98.png" alt="LALAGAY游戏室">
  <div id="historyBtn" style="position:absolute;top:14px;right:14px;cursor:pointer;font-size:20px;z-index:100;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);padding:5px 10px;border-radius:10px;backdrop-filter:blur(4px)" title="历史记录">📜<span style="font-size:12px;color:#eee;letter-spacing:1px">历史记录</span></div>
  <div id="meChip" class="me-chip" title="点击设置昵称和头像"></div>
  <div id="profileModal" class="hidden" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:102;display:flex;align-items:center;justify-content:center">
    <div style="background:#16213e;border-radius:12px;padding:20px;max-width:420px;width:90%;max-height:88vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="margin:0">👤 个人资料</h2>
        <span id="profileClose" style="cursor:pointer;font-size:24px">✕</span>
      </div>
      <label style="font-size:13px;color:#9bb">昵称（最多12字）</label>
      <input id="profileName" maxlength="12" placeholder="输入你的昵称" style="width:100%;box-sizing:border-box;margin:6px 0 14px;padding:10px 12px;border-radius:8px;border:1px solid #3a4a6b;background:#0f1c33;color:#fff;font-size:15px">
      <label style="font-size:13px;color:#9bb">头像（上传图片后可拖动、缩放裁剪）</label>
      <div class="avatar-preview">
        <span id="profileAvaPreview" class="ava xl"></span>
      </div>
      <div id="cropWrap" class="hidden">
        <div id="cropBox"><img id="cropImg" alt="裁剪预览"></div>
        <div class="crop-zoom-row"><span>🔍</span><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"><span>✦</span></div>
        <div style="font-size:12px;color:#88a;text-align:center;margin-bottom:10px">拖动图片调整位置，滑动缩放</div>
      </div>
      <label for="avatarUpload" class="upload-btn">📷 选择 / 更换图片</label>
      <input id="avatarUpload" type="file" accept="image/*" style="display:none">
      <div class="row" style="justify-content:flex-end;margin-top:16px">
        <button id="profileCancel">取消</button>
        <button id="profileSave" class="primary">保存</button>
      </div>
    </div>
  </div>
  <div id="historyModal" class="hidden" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:101;display:flex;align-items:center;justify-content:center">
    <div style="background:#16213e;border-radius:12px;padding:20px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0">📜 游戏历史</h2>
        <span id="historyClose" style="cursor:pointer;font-size:24px">✕</span>
      </div>
      <div id="historyList"></div>
    </div>
  </div>
  <div id="gameBtnGrid" class="game-btn-grid"></div>
  <div class="row" style="justify-content:center;margin-top:12px">
    <button id="createBtn">创建房间</button>
  </div>
  <h2>房间列表</h2>
  <div id="roomList" class="room-list"></div>
</div>

<!-- 房间 -->
<div id="room" class="page hidden">
  <h1 id="roomTitle"></h1>
  <p class="sub">房间号 <b id="roomIdText"></b>（告诉朋友输入此号码加入）</p>
  <div class="row">
    <select id="roomGameSelect"></select>
    <button id="switchBtn">切换游戏</button>
  </div>
  <div id="playerSlots" class="slots"></div>
  <div class="row">
    <button id="startBtn" class="primary">开始游戏</button>
    <button id="fillBotsBtn">🤖 一键填满电脑</button>
    <button id="leaveBtn">离开房间</button>
  </div>
  <p class="hint">需要人满才能开始。斗地主 3 人，其余 4 人。空位可由电脑替补，方便单人测试。</p>
</div>

<!-- 游戏 -->
<div id="game" class="page hidden">
  <div id="gameHeader">
    <span id="gameName"></span>
    <span id="gameStatus"></span>
    <span id="gameActions">
      <button id="pauseBtn" style="padding:6px 14px;font-size:14px">⏸️ 暂停</button>
      <button id="quitBtn" style="padding:6px 14px;font-size:14px">🚪 退出</button>
    </span>
  </div>
  <div id="pauseOverlay" class="hidden" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">
    <div style="font-size:32px">⏸️ 游戏已暂停</div>
    <button id="resumeBtn" class="primary" style="padding:12px 32px;font-size:18px">继续游戏</button>
  </div>
  <div id="board"></div>
</div>

<div id="toast"></div>

<script src="app.js?v=71"></script>
</body>
</html>
